name: Debug Analyze
on:
  workflow_dispatch: {}
  push:
    branches: [debug/analyze]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and emit annotations
        run: |
          flutter analyze . > analyze_out.txt 2>&1 || true
          cat analyze_out.txt
          python3 - <<'PY'
          import re
          txt = open('analyze_out.txt', encoding='utf-8', errors='replace').read()
          pat = re.compile(r'^\s{2}(.+?):(\d+):(\d+):\s+(error|warning|info):\s+(.+)$', re.I)
          for line in txt.splitlines():
              m = pat.match(line)
              if m:
                  path, ln, col, sev, msg = m.groups()
                  level = sev.lower()
                  if level == 'info':
                      level = 'notice'
                  print(f'::{level} file=flutter_app/{path},line={ln},col={col}::{msg}')
          PY
