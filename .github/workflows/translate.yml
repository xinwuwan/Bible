# Translate KJV -> Chinese (our_zh) via LLM
#
# 用途：用 LLM 从 KJV 英文**直译**生成「本应用中文译文」(our_zh.json)。
#       译文为应用独立产出，绝不复制和合本等现有中文译本（合规铁律）。
# 触发：仓库 Actions 页 -> Translate KJV to Chinese -> Run workflow
# 前置：在 仓库 Settings > Secrets and variables > Actions 中添加：
#        LLM_API_KEY  （必填，你的 OpenAI / DeepSeek / Qwen 等兼容接口密钥）
#        LLM_BASE_URL （可选，默认 https://api.openai.com/v1）
#        LLM_MODEL    （可选，默认 gpt-4o-mini）
# 效果：翻译断点续译（our_zh.json 已译章节自动跳过），完成后自动合并并重新部署。
# 接力：每轮最多译 300 章（约 1.5h，远小于 350min 超时），跑完若仍有未译章节，
#       自动触发下一轮续译，直到全本译完——无需人工反复点击。进度每 25 章落库一次。

name: Translate KJV to Chinese

on:
  workflow_dispatch:
    inputs:
      books:
        description: "只译指定书卷 id（逗号分隔，如 1,2,3；留空 = 全本）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# 串行化：自动续译会触发下一轮 run，concurrency 让其排队等待，
# 避免多个翻译 run 并发读写 our_zh.json 造成竞态。
concurrency:
  group: translate-kjv
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 关键：仓库里提交的 app_data.json 只有种子数据，
      # 全本 KJV 由本步骤临时抓取生成（不提交），供翻译脚本使用。
      - name: Fetch full KJV into app_data.json
        run: python3 fetch_kjv.py

      - name: Translate pending chapters (resume from our_zh.json)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.books }}" ]; then
            ARGS="--books ${{ github.event.inputs.books }}"
          fi
          python3 translate_kjv.py --max-chapters 300 $ARGS

      - name: Commit our_zh.json (final flush)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flutter_app/assets/web/our_zh.json
          if git diff --cached --quiet; then
            echo "no new translations this run"
          else
            git commit -m "chore: translate more KJV chapters via LLM"
            git push
          fi

      - name: Continue if chapters remain (auto redispatch)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAIN=$(python3 translate_kjv.py --dry-run | grep -oE '待译章数 = [0-9]+' | grep -oE '[0-9]+' | head -1)
          echo "remaining chapters: ${REMAIN:-0}"
          if [ "${REMAIN:-0}" -gt 0 ]; then
            echo "仍有未译章节，自动触发下一轮续译..."
            gh workflow run translate.yml
          else
            echo "全部章节已翻译完成。"
          fi

      - name: Trigger deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml
