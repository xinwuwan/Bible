# Build & push the Module-B backend image to GitHub Container Registry (GHCR).
#
# 作用：当 backend/ 目录有改动并 push 到 main 时，自动
#   1) 跑后端测试（test_contract.py / test_api.py）—— 失败则中止，不发布坏镜像
#   2) 构建 backend/ 的 Docker 镜像并推送到 ghcr.io/<owner>/<repo>-backend
#
# 这是「可选增强」：Web 链接本身不依赖后端（模块 B 离线问答已内置在网页里）。
# 仅在你想把真实 LLM 问答后端独立部署时才需要它。
# 镜像推送到 GHCR 不需要额外配置，使用仓库自带的 GITHUB_TOKEN 即可。
#
# 拉取/运行（部署到任意支持 Docker 的平台，如 Railway / Render / Fly / 云服务器）：
#   docker pull ghcr.io/<owner>/<repo>-backend:latest
#   docker run -p 8000:8000 ghcr.io/<owner>/<repo>-backend:latest

name: Build & Push Backend Image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # GHCR 镜像名必须全小写
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test gate — backend contract (no deps)
        working-directory: backend
        run: python3 tests/test_contract.py

      - name: Test gate — backend API (needs fastapi)
        working-directory: backend
        run: |
          python3 -m pip install -r requirements.txt
          python3 tests/test_api.py

      - name: Set lowercased image name
        run: echo "IMAGE=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
