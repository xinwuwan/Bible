# pubspec_example.yaml
# 全应用（模块 A 对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART）的依赖与资产声明
# 复制到 Flutter 项目根目录并改名为 pubspec.yaml
#
# 注意：本工作区的 .dart 文件是平铺的（与 offline_db_helper.dart 同级），
# 放入真实 Flutter 工程时请把它们移到 lib/ 下，例如:
#   lib/main.dart
#   lib/app_models.dart            lib/note_repository.dart
#   lib/offline_db_helper.dart     lib/comparison_page.dart
#   lib/verse_compare_card.dart    lib/comparison_note_sheet.dart
#   lib/search_page.dart
#   lib/qa_models.dart             lib/qa_repository.dart
#   lib/citation_list.dart         lib/qa_page.dart            （模块 B）
#   lib/health_models.dart         lib/health_repository.dart
#   lib/health_page.dart           lib/health_topic_page.dart
#   lib/health_topic_card.dart     lib/health_checkin_sheet.dart （模块 C）
# 测试放 test/、test/helpers/。
# 资产：build_offline_db.py 产出的 app_offline.db、export_notes_json.py 产出的 notes.json。

name: faith_compare_app
description: 全球华人跨平台信仰应用 —— 模块 A 翻译与对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART
publish_to: "no"
# 每次发布递增 +N：flutter build 会把该版本写进 version.json，
# 浏览器 Service Worker 据此检测更新并刷新缓存（避免用户停留在旧版本）。
version: 1.1.0+76
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.0                 # 路径拼接
  path_provider: ^2.1.0        # 可写目录（首次复制预置库用）
  http: ^1.2.0                 # 远端注记 / 问答 / 同步（离线时不可用则降级）
  shared_preferences: ^2.2.2   # 首次引导页「已看过」标记持久化
  file_picker: ^8.0.0          # 专业咨询模块：上传病历附件（web 端 withData 取字节）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0   # 3.x 自带 analysis_options_user.yaml；^5.x 要求 Dart ≥3.5（本项目 Dart 3.4.4 不适用）

flutter:
  uses-material-design: true
  assets:
    - assets/web/app_data.json  # gen_web_data.py 产物（web 通用离线数据，取代 app_offline.db）
    - assets/web/qa_faq.json    # 模块 B 离线信仰问答库（无需后端即可本地真实回答）
    - assets/web/kjv_cuv_diffs.json  # KJV↔和合本差异标示（analyze_kjv_cuv.py 生成）
    - assets/web/health_faq.json   # 模块 C 离线健康问答库（NEWSTART，无需后端）
    - assets/web/health_daily.json # 模块 C 每日健康一贴（按日轮换）
    - assets/web/egw_verses.json   # 怀爱伦(EGW)经文论述（_egw_fetch.py 生成，初始为空 {}）
    - assets/web/egw_sc_align.json  # 怀著中英对照：喜乐的泉源(SC)
    - assets/web/egw_da_align.json  # 怀著中英对照：历代愿望(DA)
    - assets/web/egw_gc_align.json  # 怀著中英对照：善恶之争(GC)
    - assets/web/egw_mh_align.json  # 怀著中英对照：服务真诠(MH)
    - assets/web/egw_pp_align.json  # 怀著中英对照：先祖与先知(PP)
    - assets/web/egw_pk_align.json  # 怀著中英对照：先知与君王(PK)
    - assets/web/egw_aa_align.json  # 怀著中英对照：使徒行述(AA)
    - assets/web/egw_ed_align.json  # 怀著中英对照：教育论(Ed)
    - assets/web/egw_col_align.json # 怀著中英对照：基督比喻实训(COL)
    # 告青年书(MYP) 暂未上线：其中文版(14475)为「主题重编/选编」而非英文版(76)的平行译本，
    # 章节边界与段落顺序均不对应，自动化对齐会产出错配对照，违反内容准确铁律；待换平行译本源或人工逐段对照后再上线。
    - assets/web/disease_profiles.json    # 专业咨询：疾病科普库（成因/影响/预后/NEWSTART建议）
    - assets/web/disease_profiles_2.json  # 专业咨询：疾病科普库（第二批）
    - assets/web/disease_profiles_3.json  # 专业咨询：疾病知识库（第三批：形成机制/健康影响/鉴别/检查/就医信号/来源）
    - assets/web/hospital_tier_a.json     # 专业咨询：三甲/专科识别规则 + 重大疾病分级关键词
    - assets/web/consult_scripts.json     # AI 医生：多轮问诊剧本（主诉/问题/鉴别/红旗规则）
    - assets/notes.json         # export_notes_json.py 产物（26 条，全部 status=draft）

# 字体策略：不内置任何自定义字体。
# 英文经文走系统默认无衬线（安卓 Roboto / iOS 苹方 / Web 浏览器默认），半角空格宽度正常，
# 彻底避免「中文衬线渲染拉丁字母导致单词粘连」。曾内置 Tinos，但线上字体文件 404 加载失败，
# 回退到中文衬线反而加剧粘连，故弃用。

# 构建示例（正式发布不要开 SHOW_DRAFT_NOTES / SHOW_UNREVIEWED_HEALTH）:
#   flutter build apk --dart-define=API_BASE=https://api.example.com \
#     --dart-define=USE_REMOTE_NOTES=true --dart-define=USE_REMOTE_QA=true
#   flutter run --dart-define=SHOW_DRAFT_NOTES=true         # 仅联调：查看 draft 注记
#   flutter run --dart-define=SHOW_UNREVIEWED_HEALTH=true   # 仅联调：查看未审健康条目
#
# 离线包构建（健康条目默认被闸门过滤，内部预览才放行）:
#   python build_offline_db.py --from-json offline_sample.json --out assets/app_offline.db
#   python build_offline_db.py --from-json offline_sample.json --out preview.db --allow-unreviewed-health
