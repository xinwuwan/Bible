<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <!--
    If you are serving your web app in a browser, the head is the place
    to add your <meta> tags, <link> tags, and <script> tags.
  -->
  <meta charset="UTF-8">
  <!-- 显式声明视口：不要依赖 Flutter 引擎运行时注入。viewport-fit=cover 适配刘海屏；
       maximum-scale=1.0 + user-scalable=no 与 Flutter 官方模板一致，避免双击/误触
       整页缩放破坏应用式布局。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 本页内容已是简体中文，禁止浏览器自动翻译（防止被转成繁体显示） -->
  <meta name="google" content="notranslate">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="全球华人跨平台信仰应用 —— 模块 A 翻译对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="真理对照">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>真理对照</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 禁止 iOS Safari / 微信内置浏览器按系统「文字大小」设置自动放大页面文字：
       Flutter web html 渲染器的文字由引擎按 px 精确排版，浏览器一旦自动放大
       字形（-webkit-text-size-adjust:auto 的默认行为），文字就会溢出引擎算好
       的布局盒 → 拥挤、重叠。100% = 完全不调整。该属性可继承进 shadow DOM，
       因此同时覆盖 Flutter 渲染的正文与下面的首屏 loading 层。 */
    html, body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    /* 首屏 loading：Flutter 引擎启动前（html renderer 无 canvaskit 依赖，
       启动前只有白屏）给出明确反馈，避免用户以为页面卡死。 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FAF8F3;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      color: #6E6A63;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loading.done { opacity: 0; pointer-events: none; }
    #app-loading .ring {
      width: 42px;
      height: 42px;
      border: 3px solid #E9E4DA;
      border-top-color: #43518F;
      border-radius: 50%;
      animation: app-spin 0.9s linear infinite;
    }
    #app-loading p {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 2px;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ring"></div>
    <p>真理对照 · 加载中</p>
  </div>
  <script src="main.dart.js" type="application/javascript"></script>
  <script>
    // Flutter 首帧渲染后移除 loading 层。
    // 注意：main.dart.js 是动态加载 flutter_bootstrap.js 的，本脚本执行时
    // window._flutter 尚未就绪，因此轮询 DOM：html renderer 首帧会插入
    // <flt-glass-pane>，canvaskit 则插入 <canvas>，二者任一出现即视为已渲染。
    (function () {
      var done = function () {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('done');
          setTimeout(function () { el.remove(); }, 350);
        }
      };
      var check = function (tries) {
        if (document.querySelector('flt-glass-pane, canvas')) {
          done();
          return;
        }
        if (tries > 0) {
          setTimeout(function () { check(tries - 1); }, 100);
        }
        // 超过 20 秒仍未渲染：保留 loading 层（说明真的卡住了），
        // 由用户在控制台看到的具体报错决定下一步，不自动隐藏掩盖问题。
      };
      check(200);
    })();
  </script>
</body>
</html>
