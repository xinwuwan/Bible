<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <!--
    微信内置浏览器(X5) 渲染策略说明（重要，避免再次踩坑）：
    1) --web-renderer auto 在手机端默认走 HTML 渲染器（engine/renderer.dart：
       auto 且未显式指定时 useCanvasKit = isDesktop，移动端=false → HTML）。
       X5 对 HTML 渲染器的 DOM 文本排版存在字体放大 / 词间空格折叠缺陷
       （Flutter issue #145140），会让英文单词粘连、排版过紧。
       故仅对 X5 系内核（微信 / QQ / TBS）显式请求 canvaskit（Skia 直接绘制，
       彻底规避该缺陷）；其余浏览器维持 HTML（系统字体渲染中文，本就正常）。
    2) canvaskit 需要 WebGL + 下载 ~6.7MB wasm。仅当 X5 且 WebGL 可用时才启用，
       无 WebGL 时回落默认 HTML（至少能打开，不会白屏/报错）。
    3) canvaskit 与 CJK 回退字体均自托管（web/canvaskit/、web/fonts/），
       不依赖被墙的 gstatic.com（否则 wasm 拉取慢、中文变成方框）。
    4) 自托管 wasm 的加载依赖 main.dart.js 自身的相对路径解析，**绝不能**给
       main.dart.js 加 ?cb= 之类查询串（会让引擎内部资源定位失败 → 黑屏/不渲染）。
       本页通过「不使用查询串」+ 下方 no-cache meta，让微信重新拉取新包。
  -->
  <meta charset="UTF-8">
  <!-- 视口：固定宽度=设备宽度；maximum-scale=1.0 + user-scalable=no 与 Flutter 官方
       模板一致，避免双击/误触整页缩放破坏应用式布局。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 禁止浏览器按系统「文字大小」自动放大页面文字（X5 的 -webkit-text-size-adjust
       默认行为会把字形放大、撑爆引擎算好的布局盒 → 拥挤/重叠）。100% = 不调整。 -->
  <meta name="google" content="notranslate">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="全球华人跨平台信仰应用 —— 模块 A 翻译对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART">

  <!-- 微信 X5 缓存极激进且不支持 Service Worker，仅靠 max-age 会长期返回陈旧构建。
       这里用 HTTP 头级 no-cache 提示，配合下方「main.dart.js 不带查询串」的改动，
       双重强制微信重新拉取新包（旧包曾在 main.dart.js 后加了 ?cb=，URL 不同，
       现在去掉查询串 = 新 URL，微信必定重新下载）。 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="真理对照">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>真理对照</title>
  <link rel="manifest" href="manifest.json">
  <!-- 自托管 CanvasKit：指向随仓库附带的 web/canvaskit/，避免从 gstatic.com 拉取
       （国内被墙/极慢）。必须在入口脚本之前声明。与 CI 的
       --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ 配合。 -->
  <script>
    window.flutterConfiguration = window.flutterConfiguration || {};
    // 1) 自托管 CanvasKit（国内避免 gstatic.com 被墙/极慢）。必须在入口脚本之前声明。
    window.flutterConfiguration.canvasKitBaseUrl = 'canvaskit/';
    // 2) 自托管 CJK 回退字体（国内避免 gstatic.com 被墙 → 中文变成方框）。
    //    CanvasKit 不调用系统字体，遇到中文缺字时必须从这里下载 Noto Sans SC/TC。
    window.flutterConfiguration.fontFallbackBaseUrl = 'fonts/';
    // 3) 关键修复：手机端 --web-renderer auto 默认走 HTML 渲染器
    //    （engine/renderer.dart：auto 且未显式指定时 useCanvasKit = isDesktop，
    //     移动端 = false → HTML）。HTML 渲染器在微信 X5 内核下存在
    //    「词间空格折叠 / 字体放大」缺陷（Flutter issue #145140），导致英文
    //    单词粘连、排版过紧。这里仅对 X5 系内核（微信 / QQ / TBS）显式请求
    //    canvaskit，由 Skia 直接绘制文字，彻底规避该缺陷；其余浏览器维持
    //    HTML（系统字体渲染中文，加载更轻，且本就正常）。
    //    仅当 WebGL 可用时才请求 canvaskit：无 WebGL 的环境回落到默认 HTML，
    //    至少能打开，不会白屏。
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isX5 = /MicroMessenger|MQQBrowser|TBS\/|QQBrowser/i.test(ua);
        var cv = document.createElement('canvas');
        var gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
        if (isX5 && gl) {
          window.flutterConfiguration.renderer = 'canvaskit';
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // 首屏字体预热：微信 X5 / CanvasKit 下，自托管 Noto SC/TC 回退字体需先下载（约数 MB），
    // 否则首个画面中文会短暂空白。这里提前把这两个字体注册进 document.fonts 并预取，
    // 让下方 loading 遮罩在字体就绪前一直显示「真理对照 · 加载中」，消除无字空白期。
    (function () {
      try {
        if (!window.FontFace || !document.fonts) return;
        var base = document.baseURI || location.href;
        var dir = base.replace(/[^/]+$/, ''); // base href 以 / 结尾
        var defs = [
          ['Noto Sans SC', dir + 'fonts/notosanssc/v36/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYxNbPzS5HE.ttf'],
          ['Noto Sans TC', dir + 'fonts/notosanstc/v35/-nFuOG829Oofr2wohFbTp9ifNAn722rq0MXz76Cy_CpOtma3uNQ.ttf']
        ];
        window.__cjkFonts = defs.map(function (d) {
          // 仓库只自托管了单字重(400)的 Noto Sans SC/TC。原先不带描述符注册时，
          // 页面一旦请求 w600/w700/bold，浏览器/CanvasKit 会对中文做「合成加粗」
          // （重复描边），把密笔画字（如「问」门框内的「口」）糊成黑块。
          // 这里把该字体声明为覆盖 100–900 全字重：所有字重请求都直接复用真实
          // 字形，不再触发 faux bold；字重层级由应用侧字号/字距/颜色表达。
          var ff;
          try {
            ff = new FontFace(d[0], 'url(' + d[1] + ')', {
              weight: '100 900',
              style: 'normal'
            });
          } catch (_) {
            // 老内核（部分 X5）不接受字重区间描述符：退回原注册方式，
            // 宁可保留旧行为，也不能让字体预热整体失败导致首屏中文空白。
            ff = new FontFace(d[0], 'url(' + d[1] + ')');
          }
          document.fonts.add(ff);
          return ff.load().catch(function () {});
        });
      } catch (e) {}
    })();
  </script>
  <style>
    /* 同时覆盖首屏 loading 层与 Flutter 渲染正文：禁止文字自动放大。 */
    html, body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    /* 首屏 loading：引擎启动前（canvaskit 需先下载 wasm，启动前只有白屏）给出
       明确反馈，避免用户以为页面卡死。仅作展示，绝不显示任何「请用系统浏览器」
       之类的引导——本应用目标就是「微信里直接正常显示」。 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FAF8F3;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #6E6A63;
      z-index: 9999;
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 0 24px;
    }
    #app-loading.done { opacity: 0; pointer-events: none; }
    #app-loading .ring {
      width: 42px;
      height: 42px;
      border: 3px solid #E9E4DA;
      border-top-color: #43518F;
      border-radius: 50%;
      animation: app-spin 0.9s linear infinite;
    }
    #app-loading .msg {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ring"></div>
    <div class="msg" id="app-loading-msg">真理对照 · 加载中</div>
  </div>
  <!-- 关键：main.dart.js 在本 Flutter 版本是自举的入口，必须「不带任何查询串」直接加载，
       否则引擎内部相对路径（canvaskit、service worker 等）定位失败 → 黑屏/不渲染。
       之前给 main.dart.js 加 ?cb= 查询串正是导致微信「完全打不开」的直接原因。 -->
  <script src="main.dart.js" type="application/javascript"></script>
  <script>
    // 揭幕时机（关键：消除「首屏无字空白期」）：
    // 先在 head 中预热的 CJK 字体 Promise 全部 settled（loaded 或失败）后，再等画布首帧
    // （html 渲染器插 <flt-glass-pane>、canvaskit 插 <canvas>）出现，最后揭幕。
    // 这样首屏始终先显示「真理对照 · 加载中」文字层，文字就绪才揭幕，无空白感。
    // 12s 硬上限兜底，极端弱网也绝不长期遮挡应用。本脚本不做任何报错/跳转引导。
    (function () {
      var el = document.getElementById('app-loading');
      var hidden = false;
      var hide = function () {
        if (hidden || !el) return;
        hidden = true;
        el.classList.add('done');
        setTimeout(function () { if (el) el.remove(); }, 350);
      };
      var start = Date.now();
      var MAX = 12000;
      var canvasUp = false;
      var cjk = window.__cjkFonts || [];
      function reveal() {
        if (hidden) return;
        var elapsed = Date.now() - start;
        if (!canvasUp && document.querySelector('flt-glass-pane, canvas')) canvasUp = true;
        if (canvasUp && elapsed > 1000) hide();
        else if (elapsed > MAX) hide();
        else setTimeout(reveal, 150);
      }
      Promise.all(cjk).catch(function () {}).then(reveal);
      setTimeout(hide, MAX);
    })();
  </script>
</body>
</html>
