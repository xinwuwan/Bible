<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <!--
    If you are serving your web app in a browser, the head is the place
    to add your <meta> tags, <link> tags, and <script> tags.
  -->
  <meta charset="UTF-8">
  <!-- 显式声明视口：不要依赖 Flutter 引擎运行时注入。viewport-fit=cover 适配刘海屏；
       maximum-scale=1.0 + user-scalable=no 与 Flutter 官方模板一致，避免双击/误触
       整页缩放破坏应用式布局。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 本页内容已是简体中文，禁止浏览器自动翻译（防止被转成繁体显示） -->
  <meta name="google" content="notranslate">
  <!-- 微信内置浏览器(X5) 缓存极度激进且不支持 Service Worker，仅靠 max-age 容易长期
       返回陈旧构建。这里用 HTTP 头级别的 no-cache 提示，配合下方 main.dart.js 的
       版本化查询串 (?cb=...)，双重强制微信重新拉取新包。 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="全球华人跨平台信仰应用 —— 模块 A 翻译对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="真理对照">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>真理对照</title>
  <link rel="manifest" href="manifest.json">
  <!-- 自托管 CanvasKit：指向随仓库附带的 web/canvaskit/ 目录，避免从 gstatic.com 拉取
       （国内被墙/极慢）。必须在引擎入口脚本之前声明。
       微信内置浏览器(X5) 对 Flutter html 渲染器的 DOM 文本排版存在字体放大 / 空格折叠
       缺陷（Flutter issue #145140），因此本应用**强制**使用 canvaskit 渲染器
       （见 CI 的 --web-renderer canvaskit），由 Skia 直接绘制文字，彻底规避该缺陷。
       与 CI 构建参数 --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ 配合。 -->
  <script>
    window.flutterConfiguration = window.flutterConfiguration || {};
    window.flutterConfiguration.canvasKitBaseUrl = 'canvaskit/';
  </script>
  <style>
    /* 首屏 loading：Flutter 引擎启动前（canvaskit 需先下载 ~6.7MB wasm，
       启动前只有白屏）给出明确反馈，避免用户以为页面卡死。 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FAF8F3;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #6E6A63;
      z-index: 9999;
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 0 24px;
    }
    #app-loading.done { opacity: 0; pointer-events: none; }
    #app-loading .ring {
      width: 42px;
      height: 42px;
      border: 3px solid #E9E4DA;
      border-top-color: #43518F;
      border-radius: 50%;
      animation: app-spin 0.9s linear infinite;
    }
    #app-loading .msg {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ring"></div>
    <div class="msg" id="app-loading-msg">真理对照 · 加载中</div>
  </div>
  <script>
    // 入口加载逻辑（含 WebGL 预检 + 缓存强制刷新 + 渲染超时兜底）。
    // 关键背景：微信内置浏览器(X5) 对 Flutter html 渲染器的文字排版有致命缺陷
    // （字体放大 / 词间空格折叠，见 Flutter issue #145140），因此本应用强制
    // canvaskit 渲染器。canvaskit 需要 WebGL；若设备/浏览器不支持 WebGL，
    // 提前给出明确引导，避免白屏。
    (function () {
      var loading = document.getElementById('app-loading');
      var msgEl = document.getElementById('app-loading-msg');
      function show(msg, isError) {
        if (msgEl) msgEl.innerHTML = msg;
        if (loading) {
          // 错误态：去掉转圈，保留文案
          var ring = loading.querySelector('.ring');
          if (ring && isError) ring.style.display = 'none';
          loading.classList.remove('done');
        }
      }

      // 1) WebGL 预检：不支持则引导到系统浏览器，绝不白屏。
      function hasWebGL() {
        try {
          var c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext &&
            (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch (e) { return false; }
      }
      if (!hasWebGL()) {
        show('当前浏览器不支持 WebGL，无法完整显示。<br><br>请点击右上角「···」→「在浏览器打开」，使用手机系统浏览器（Safari / Chrome）访问。');
        return; // 不加载 Flutter，避免白屏
      }

      // 2) 加载 Flutter 入口；?cb= 为缓存破坏串（由 CI 替换为本次提交 SHA），
      //    强制微信 X5 重新下载 main.dart.js，而不是用陈旧缓存的旧包。
      var s = document.createElement('script');
      s.src = 'main.dart.js?cb={{CACHE_BUST}}';
      s.type = 'application/javascript';
      s.onerror = function () {
        show('资源加载失败，请检查网络后重试，或在手机系统浏览器中打开本页面。', true);
      };
      document.body.appendChild(s);

      // 3) 渲染超时兜底：25s 内未出现 <canvas>（CanvasKit 渲染面）则提示。
      var done = false;
      var timer = setTimeout(function () {
        if (!done && !document.querySelector('canvas')) {
          show('页面渲染超时，请下拉刷新，或在手机系统浏览器中打开本页面。', true);
        }
      }, 25000);

      // 4) 检测首帧：CanvasKit 会插入 <canvas>，出现即视为渲染成功，移除 loading。
      var check = function (n) {
        if (document.querySelector('canvas')) {
          done = true;
          clearTimeout(timer);
          if (loading) {
            loading.classList.add('done');
            setTimeout(function () { loading.remove(); }, 350);
          }
          return;
        }
        if (n > 0) setTimeout(function () { check(n - 1); }, 100);
      };
      check(250);
    })();
  </script>
</body>
</html>
