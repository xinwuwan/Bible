<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <!--
    微信内置浏览器(X5) 渲染策略说明（重要，避免再次踩坑）：
    1) X5 对 Flutter「html 渲染器」的 DOM 文本排版存在字体放大 / 词间空格折叠缺陷
       （Flutter issue #145140），会让英文单词粘连。故优先用 canvaskit（Skia 直接
       绘制，彻底规避该缺陷）。
    2) 但 canvaskit 需要 WebGL + 下载 ~6.7MB wasm。为「保证微信里一定能打开」，
       构建使用 --web-renderer auto：支持 WebGL 时走 canvaskit（文字正常），
       不支持时自动回退 html（至少能打开，不会白屏/报错）。
    3) canvaskit 自托管（web/canvaskit/），不依赖被墙的 gstatic.com。
    4) 自托管 wasm 的加载依赖 main.dart.js 自身的相对路径解析，**绝不能**给
       main.dart.js 加 ?cb= 之类查询串（会让引擎内部资源定位失败 → 黑屏/不渲染）。
       本页通过「不使用查询串」+ 下方 no-cache meta，让微信重新拉取新包。
  -->
  <meta charset="UTF-8">
  <!-- 视口：固定宽度=设备宽度；maximum-scale=1.0 + user-scalable=no 与 Flutter 官方
       模板一致，避免双击/误触整页缩放破坏应用式布局。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 禁止浏览器按系统「文字大小」自动放大页面文字（X5 的 -webkit-text-size-adjust
       默认行为会把字形放大、撑爆引擎算好的布局盒 → 拥挤/重叠）。100% = 不调整。 -->
  <meta name="google" content="notranslate">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="全球华人跨平台信仰应用 —— 模块 A 翻译对照 / 模块 B 牧师问答 / 模块 C 健康 NEWSTART">

  <!-- 微信 X5 缓存极激进且不支持 Service Worker，仅靠 max-age 会长期返回陈旧构建。
       这里用 HTTP 头级 no-cache 提示，配合下方「main.dart.js 不带查询串」的改动，
       双重强制微信重新拉取新包（旧包曾在 main.dart.js 后加了 ?cb=，URL 不同，
       现在去掉查询串 = 新 URL，微信必定重新下载）。 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="真理对照">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>真理对照</title>
  <link rel="manifest" href="manifest.json">
  <!-- 自托管 CanvasKit：指向随仓库附带的 web/canvaskit/，避免从 gstatic.com 拉取
       （国内被墙/极慢）。必须在入口脚本之前声明。与 CI 的
       --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ 配合。 -->
  <script>
    window.flutterConfiguration = window.flutterConfiguration || {};
    window.flutterConfiguration.canvasKitBaseUrl = 'canvaskit/';
  </script>
  <style>
    /* 同时覆盖首屏 loading 层与 Flutter 渲染正文：禁止文字自动放大。 */
    html, body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    /* 首屏 loading：引擎启动前（canvaskit 需先下载 wasm，启动前只有白屏）给出
       明确反馈，避免用户以为页面卡死。仅作展示，绝不显示任何「请用系统浏览器」
       之类的引导——本应用目标就是「微信里直接正常显示」。 */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FAF8F3;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #6E6A63;
      z-index: 9999;
      transition: opacity 0.3s ease;
      text-align: center;
      padding: 0 24px;
    }
    #app-loading.done { opacity: 0; pointer-events: none; }
    #app-loading .ring {
      width: 42px;
      height: 42px;
      border: 3px solid #E9E4DA;
      border-top-color: #43518F;
      border-radius: 50%;
      animation: app-spin 0.9s linear infinite;
    }
    #app-loading .msg {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="ring"></div>
    <div class="msg" id="app-loading-msg">真理对照 · 加载中</div>
  </div>
  <!-- 关键：main.dart.js 在本 Flutter 版本是自举的入口，必须「不带任何查询串」直接加载，
       否则引擎内部相对路径（canvaskit、service worker 等）定位失败 → 黑屏/不渲染。
       之前给 main.dart.js 加 ?cb= 查询串正是导致微信「完全打不开」的直接原因。 -->
  <script src="main.dart.js" type="application/javascript"></script>
  <script>
    // Flutter 首帧渲染后移除 loading 层。main.dart.js 动态初始化引擎，本脚本执行时
    // window._flutter 可能尚未就绪，故轮询 DOM：html 渲染器首帧插入 <flt-glass-pane>，
    // canvaskit 渲染器插入 <canvas>，二者任一出现即视为已渲染。
    // 注意：本脚本**不做任何报错/跳转引导**，只负责隐藏 loading；渲染本身交给引擎。
    (function () {
      var done = function () {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('done');
          setTimeout(function () { el.remove(); }, 350);
        }
      };
      var check = function (tries) {
        if (document.querySelector('flt-glass-pane, canvas')) {
          done();
          return;
        }
        if (tries > 0) {
          setTimeout(function () { check(tries - 1); }, 150);
        }
        // 超过约 30 秒仍未渲染：保持 loading 层（说明真的在加载 wasm 或卡住），
        // 不自动隐藏掩盖问题，也不弹出「请用系统浏览器」等引导。
      };
      check(200);
    })();
  </script>
</body>
</html>
